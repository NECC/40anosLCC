name: Unit tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bdaylcc
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d bdaylcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "5432"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Apply prisma schema to the database
        run: npm run db-push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/bdaylcc"

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/bdaylcc"
